name: Top5 Pexels candidate review
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  review:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.body, 'TOP5_PEXELS_REVIEW')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: python travel-top5-shorts/scripts/pexels_candidate_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: top5-pexels-photo-board
          path: pexels_review/
          retention-days: 3
