name: Travel Top5 source photography review
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  research:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.body, 'TOP5_RESEARCH_COMMONS')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Gather Commons photo review boards
        run: python travel-top5-shorts/scripts/research_commons_images.py
      - uses: actions/upload-artifact@v4
        with:
          name: top5-source-research-boards
          path: commons_research/
          retention-days: 3
