name: Travel TOP5 Shorts - 23.2s bilingual
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      job_path:
        description: 'Repository-local JSON job with five already approved real Pexels clips'
        type: string
        required: true
        default: 'travel-top5-shorts/examples/remote_job.sample.json'
permissions:
  contents: read
  issues: write
jobs:
  render:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.body, 'TOP5_STYLE_V2'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encoder and Korean fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check -r travel-top5-shorts/requirements.txt
      - name: Render Korean and English videos
        env:
          EVENT_NAME: ${{ github.event_name }}
          JOB_PATH: ${{ inputs.job_path }}
        run: |
          if [ "$EVENT_NAME" = 'issues' ]; then
            python travel-top5-shorts/scripts/github_runner.py --issue-event "$GITHUB_EVENT_PATH" --output-dir output_top5_v2
          else
            python travel-top5-shorts/scripts/github_runner.py --job "$JOB_PATH" --output-dir output_top5_v2
          fi
      - name: Upload verified silent videos and license record
        uses: actions/upload-artifact@v4
        with:
          name: top5-23s-ko-en-silent
          retention-days: 14
          path: |
            output_top5_v2/render/top5_ko_SILENT.mp4
            output_top5_v2/render/top5_en_SILENT.mp4
            output_top5_v2/render/cut_markers.csv
            output_top5_v2/project/source_audit.json
      - name: Report success on requesting issue
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --repo "$GH_REPO" --body "TOP5 23.2초 한국어+영어 무음 영상 제작 완료. Actions 실행 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID → Artifacts에서 다운로드하세요. 저작권 음악은 포함되지 않았습니다."