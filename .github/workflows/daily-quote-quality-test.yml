name: Daily Quote Maker - Quality Test
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'DAILY_QUOTE_TEST:')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow, Korean serif fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow
      - name: Render and validate real long-exposure Seoul photo
        run: |
          python daily-quote-maker/render_quote_card.py --job daily-quote-maker/examples/seoul_andohyeon_sample.json --output daily-quote-maker/outputs
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('daily-quote-maker/outputs/Q0061_daily_quote_IG_4x5.jpg')
          im=Image.open(p)
          assert im.size==(1080,1350), im.size
          assert p.stat().st_size>100000, p.stat().st_size
          print('OK',im.size,p.stat().st_size)
          PY
      - name: Upload artifact (sample only; no social publishing)
        uses: actions/upload-artifact@v4
        with:
          name: daily-quote-maker-v1-sample
          path: |
            daily-quote-maker/outputs/*IG_4x5.jpg
            daily-quote-maker/outputs/*STORY_9x16.jpg
            daily-quote-maker/outputs/*_provenance.json
          if-no-files-found: error
          retention-days: 14
