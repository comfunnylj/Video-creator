<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE AETHER CHRONOMETER — Steampunk Mechanical Cinematic</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0e14}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {makePost} from '/core/three/post.js';

const W=innerWidth,H=innerHeight, TAU=6.28318530718;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#15171d');
scene.fog=new THREE.FogExp2('#1f2830',0.014);
const camera=new THREE.PerspectiveCamera(39,W/H,.08,160);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.setPixelRatio(1);renderer.setSize(W,H);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.88;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const pmrem=new THREE.PMREMGenerator(renderer);
const env=pmrem.fromScene(new RoomEnvironment(),.04);
scene.environment=env.texture;scene.environmentIntensity=.60;
const P=(color,metalness=.6,roughness=.38,extra={})=>new THREE.MeshPhysicalMaterial({color,metalness,roughness,clearcoat:.4,clearcoatRoughness:.23,...extra});
const brass=P('#b38a48',.91,.21),gold=P('#dbc082',.95,.17),aged=P('#6c5133',.88,.45);
const darkbronze=P('#4b3528',.92,.31),copper=P('#a7653c',.9,.29),patina=P('#54716a',.82,.52),chrome=P('#959a9b',.93,.16);
const steel=P('#272e35',.9,.37),gunmetal=P('#141a1c',.95,.28),porcelain=P('#847a65',.05,.91);
const ember=P('#ffce83',.23,.19,{emissive:'#ff8425',emissiveIntensity:2.6}),coldLight=P('#b2e7fa',.1,.17,{emissive:'#7cc7f0',emissiveIntensity:2.2});
const stone=P('#252b31',.07,.94),groundMat=P('#161c23',.37,.40);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const cylinder=(rt,rb,h,n=48)=>new THREE.CylinderGeometry(rt,rb,h,n);
function add(parent,geo,material,pos,rot){const m=new THREE.Mesh(geo,material);m.position.set(...pos);if(rot)m.rotation.set(...rot);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function cy(parent,x,y,z,r,h,m,n=48){return add(parent,cylinder(r,r,h,n),m,[x,y,z]);}
function bx(parent,x,y,z,w,h,d,m){return add(parent,new THREE.BoxGeometry(w,h,d),m,[x,y,z]);}
function sph(parent,x,y,z,r,m){return add(parent,new THREE.SphereGeometry(r,20,16),m,[x,y,z]);}
function tor(parent,x,y,z,R,r,m){return add(parent,new THREE.TorusGeometry(R,r,12,80),m,[x,y,z]);}
function link(parent,a,b,r,m){const p=V(...a),q=V(...b);const d=q.clone().sub(p);const ob=add(parent,new THREE.CylinderGeometry(r,r,d.length(),12),m,[...(p.clone().add(q).multiplyScalar(.5)).toArray()]);ob.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());return ob;}
function bolt(parent,x,y,z,r=.095){const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);
const cap=cy(g,0,0,0,r,.13,chrome,12);cap.rotation.x=Math.PI/2;
const slot=bx(g,0,.005,.083,r*1.34,.025,.014,gunmetal);return g;}
function ring(parent,x,y,z,R,t,material){return tor(parent,x,y,z,R,t,material);}
// deterministic micro-scratched PBR textures on brass and steel
function seeded(k){let x=Math.sin(k*37.881+17.17)*43758.545;return x-Math.floor(x);}
function scratchTexture(seed,mode){
 const c=document.createElement('canvas');c.width=c.height=512;const q=c.getContext('2d');
 q.fillStyle=mode==='brass'?'#b69b6b':'#757b84';q.fillRect(0,0,512,512);
 for(let i=0;i<10000;i++){
   const x=seeded(i*3+seed)*512,y=seeded(i*11+seed)*512;
   q.strokeStyle=i%3?'rgba(25,17,10,.09)':'rgba(255,236,187,.11)';q.lineWidth=.35+seeded(i+45);
   q.beginPath();q.moveTo(x,y);q.lineTo(x+4+seeded(i+67)*39,y+(seeded(i+1)-.5)*1.4);q.stroke();
 }
 for(let i=0;i<135;i++){let x=seeded(i*13+seed)*512,y=seeded(i*41+seed)*512;
  q.fillStyle='rgba(18,24,21,.15)';q.beginPath();q.ellipse(x,y,1+seeded(i+31)*14,1+seeded(i+29)*3,seeded(i*9),0,TAU);q.fill();}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;
}
const brushed=scratchTexture(4,'brass'),metalScratches=scratchTexture(7,'steel');
brass.map=brushed;brass.color.set('#bb9d76');brass.needsUpdate=true;
chrome.map=metalScratches;chrome.color.set('#bfc5c8');chrome.needsUpdate=true;

// textured brick-and-cast-iron workshop
function bricks(){
 const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#101317';g.fillRect(0,0,512,512);
 for(let y=0;y<512;y+=36)for(let x=0;x<512;x+=86){let o=(Math.floor(y/36)%2)*43;
 const v=Math.floor(seeded(x*2+y*21)*25);
 g.fillStyle=`rgb(${27+v},${31+v},${35+v})`;
 g.fillRect((x+o)%512,y,83,33);
 g.fillStyle='rgba(5,6,8,.4)';g.fillRect((x+o)%512,y+30,83,3);
 }
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(4,2);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const brickMat=new THREE.MeshStandardMaterial({map:bricks(),roughness:.94,metalness:0,color:'#778391'});
bx(scene,0,10,-11,36,22,1.2,brickMat);
bx(scene,0,-.38,0,34,.75,27,stone);
bx(scene,0,.02,0,31,.065,25,groundMat);
for(let side of [-1,1]){
 bx(scene,side*13.8,9,0,.7,17,27,brickMat);
 for(let z of [-9,-1,7]){
  const pillar=cy(scene,side*13.1,7.4,z,.75,15,steel);cy(scene,side*13.1,14.95,z,.94,.56,brass);
  cy(scene,side*13.1,1,z,.95,2,copper);
 }
}
for(let x=-15;x<=15;x+=4.5){bx(scene,x,17,-8.6,.24,1.2,3.4,steel);}
// Floor rivets and reflective wet grooves
for(let z=-10;z<12;z+=1.8){bx(scene,0,.084,z,29,.035,.05,gunmetal);}
for(let x=-15;x<15;x+=2.5){bx(scene,x,.083,0,.05,.035,24,darkbronze);}

// Main clockworks: centered at y 7.5, facing camera +Z
const engine=new THREE.Group();engine.position.set(0,0,-2.8);scene.add(engine);
// Massive bolted cast-iron foundation and copper plinth
bx(engine,0,1.1,.15,13.0,2.1,5.0,steel);
bx(engine,0,2.2,.35,13.4,.24,5.4,brass);bx(engine,0,.22,.15,13.8,.42,5.6,darkbronze);
for(let i=0;i<15;i++)for(let side of [-1,1]) bolt(engine,-6.2+i*.89,1.6,side*2.64,.105);

// Two ornate massive pressure-boiler columns with valves
const boilerGroups=[];
for(let side of [-1,1]){
 const b=new THREE.Group();b.position.set(side*5.4,0,.45);engine.add(b);boilerGroups.push(b);
 const boiler=cy(b,0,5.1,-.3,1.25,5.0,copper);
 cy(b,0,2.6,-.3,1.44,.40,brass);cy(b,0,7.60,-.3,1.44,.45,brass);
 for(let k=0;k<10;k++){let ang=k*TAU/10;
  const x=Math.cos(ang)*1.28,z=-.3+Math.sin(ang)*1.28;
  link(b,[x,2.8,z],[x,7.4,z],.045,gold);
 }
 for(let y of [3.0,4.55,6.2,7.3]){
  cy(b,0,y,-.3,1.33,.12,aged);
  for(let k=0;k<14;k++){const a=k*TAU/14;
   const b0=add(b,cylinder(.067,.067,.08,8),gold,[Math.cos(a)*1.36,y,Math.sin(a)*1.36-.3]);
   b0.rotation.set(Math.PI/2,0,a);
  }
 }
 // dome, exhaust chimney, steam nozzle
 sph(b,0,7.85,-.3,1.12,darkbronze);
 cy(b,0,9.05,-.3,.56,2.4,steel);
 cy(b,0,10.55,-.3,.75,.32,brass);
 // illuminated round pressure gauge on front
 const gauge=new THREE.Group();gauge.position.set(0,6.25,1.04);b.add(gauge);
 const disk=cy(gauge,0,0,.0,.72,.18,gunmetal);disk.rotation.x=Math.PI/2;
 const face=cy(gauge,0,0,.17,.59,.11,porcelain);face.rotation.x=Math.PI/2;
 ring(gauge,0,0,.24,.71,.084,brass);
 const hand=new THREE.Group();hand.position.z=.26;gauge.add(hand);
 bx(hand,0,.28,0,.075,.62,.048,gunmetal);
 for(let i=0;i<=12;i++){let a=(-.78+i*1.56/12)*Math.PI;
  const l=bx(gauge,Math.sin(a)*.47,Math.cos(a)*.47,.29,.025,i%3===0?.13:.065,.034,darkbronze);l.rotation.z=-a;}
 boilerGroups[boilerGroups.length-1].userData.hand=hand;
 // huge ornate crank valve
 const val=new THREE.Group();val.position.set(side*1.35,4.30,.65);b.add(val);
 tor(val,0,0,0,.65,.085,gold);for(let j=0;j<8;j++){const a=j*TAU/8;
  link(val,[0,0,.06],[Math.sin(a)*.64,Math.cos(a)*.64,.05],.045,chrome);}
 cy(val,0,0,.12,.13,.26,brass).rotation.x=Math.PI/2;
 b.userData.valve=val;
}
// Central housing three massive concentric decorative forged rings
const dial=new THREE.Group();dial.position.set(0,7.30,1.45);engine.add(dial);
const faceDisk=cy(dial,0,0,-.30,4.34,.64,gunmetal);faceDisk.rotation.x=Math.PI/2;
ring(dial,0,0,.02,4.35,.24,aged);ring(dial,0,0,.14,4.14,.14,gold);ring(dial,0,0,.30,3.77,.18,brass);
ring(dial,0,0,.34,3.50,.06,chrome);
const dialFace=cy(dial,0,0,.36,3.45,.16,porcelain);dialFace.rotation.x=Math.PI/2;
// radial concentric circles and precise fine machine-milled indices
ring(dial,0,0,.47,3.30,.042,darkbronze);
ring(dial,0,0,.48,2.78,.030,aged);
ring(dial,0,0,.48,1.52,.045,darkbronze);
// Roman numerals drawn on a disk face with transparent canvas texture as planar decal
const cv=document.createElement('canvas');cv.width=cv.height=1024;const ctx=cv.getContext('2d');
ctx.clearRect(0,0,1024,1024);ctx.translate(512,512);
const roman=['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
for(let i=0;i<12;i++){
 const a=i*TAU/12,px=Math.sin(a)*407,py=-Math.cos(a)*407;
 ctx.save();ctx.translate(px,py);ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.font='bold 58px Georgia';ctx.fillStyle='#2d2721';ctx.fillText(roman[i],0,0);ctx.restore();
}
for(let i=0;i<60;i++){const a=i*TAU/60;const r1=i%5===0?438:444,r2=i%5===0?470:458;
 ctx.strokeStyle='#3b3027';ctx.lineWidth=i%5===0?7:3;
 ctx.beginPath();ctx.moveTo(Math.sin(a)*r1,-Math.cos(a)*r1);
 ctx.lineTo(Math.sin(a)*r2,-Math.cos(a)*r2);ctx.stroke();}
const textureDial=new THREE.CanvasTexture(cv);textureDial.colorSpace=THREE.SRGBColorSpace;textureDial.anisotropy=8;
const decal=add(dial,new THREE.PlaneGeometry(6.84,6.84),new THREE.MeshBasicMaterial({map:textureDial,transparent:true,depthWrite:false}),[0,0,.454]);
decal.castShadow=false;
// clock hands on frontal axis
const hours=new THREE.Group();hours.position.z=.57;dial.add(hours);
const minutes=new THREE.Group();minutes.position.z=.68;dial.add(minutes);
bx(hours,0,1.08,0,.17,2.27,.095,gunmetal);
bx(hours,0,2.1,.06,.40,.14,.07,brass);
bx(minutes,0,1.39,0,.10,2.85,.095,gunmetal);
bx(minutes,0,2.57,.06,.30,.10,.07,brass);
ring(dial,0,0,.74,.25,.10,gold);
for(let a=0;a<96;a++){let angle=a*TAU/96;
 const x=Math.sin(angle)*4.35,y=Math.cos(angle)*4.35;
 const b=bolt(dial,x,y,.32,.058);
}
// Side exposed toothed gears (REAL moving geometry), depth layered
const rotors=[];
function gear(parent,x,y,z,r,teeth,material){
 const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);
 tor(g,0,0,0,r*.84,.125,material);
 tor(g,0,0,.1,r*.31,.16,aged);
 for(let i=0;i<teeth;i++){const a=i*TAU/teeth;
  const tooth=bx(g,Math.cos(a)*r*.91,Math.sin(a)*r*.91,.05,r*.28,.16,.37,material);tooth.rotation.z=a;}
 for(let i=0;i<9;i++){const a=i*TAU/9;
  const spoke=bx(g,Math.cos(a)*r*.40,Math.sin(a)*r*.40,.12,r*.92,.105,.22,aged);spoke.rotation.z=a;}
 const hub=cy(g,0,0,.25,r*.16,.40,chrome);hub.rotation.x=Math.PI/2;
 for(let i=0;i<9;i++){const a=i*TAU/9;
  bolt(g,Math.sin(a)*r*.72,Math.cos(a)*r*.72,.22,.05);}
 rotors.push(g);return g;
}
gear(engine,-4.2,4.4,3.05,2.35,30,brass);
gear(engine,-2.35,3.72,3.48,1.13,20,darkbronze);
gear(engine,4.2,4.60,3.0,2.25,30,brass);
gear(engine,2.55,3.55,3.5,1.28,20,copper);
// bevel wheels on base with actual angled arms and bar
const axle=cy(engine,0,2.85,3.0,.62,5.8,steel);axle.rotation.z=Math.PI/2;
for(let side of [-1,1]){const wheel=gear(engine,side*3.0,2.85,3.0,.76,16,aged);wheel.rotation.x=.16;}
// Animatable pistons connecting to crankshaft
const pistons=[];
for(let side of [-1,1]){
 for(let i=0;i<2;i++){
  const x=side*(1.35+i*.95);
  const base=cy(engine,x,1.95,2.10,.42,.7,chrome);
  const shaft=cy(engine,x,3.0,2.10,.13,2.0,brass);
  cy(engine,x,3.94,2.10,.38,.26,copper);
  const moving=new THREE.Group();moving.position.set(x,3,2.1);engine.add(moving);
  cy(moving,0,.35,0,.13,1.5,chrome);
  sph(moving,0,1.12,0,.22,gold);
  pistons.push({o:moving,phase:(i+(side+1))*1.15});
 }
}
// curving copper piping using CatmullRom curves, mounting clamps with bolts
function tube(parent,points,r,material){const path=new THREE.CatmullRomCurve3(points.map(p=>V(...p)));const mesh=add(parent,new THREE.TubeGeometry(path,100,r,12,false),material,[0,0,0]);return mesh;}
for(let side of [-1,1]){
 tube(engine,[[side*5.1,8.4,0],[side*5.3,9.1,2],[side*4.2,9.7,3],[side*2.6,10.0,2.4],[side*1.4,9.9,1.1]],.22,copper);
 tube(engine,[[side*6.0,3,1.0],[side*6.85,3,2.5],[side*5.2,2.4,3.15],[side*4,2.6,3.2]],.17,brass);
 for(let y=3;y<=9;y+=.65){
   const x=side*(6.78+Math.sin(y*1.3)*.03);
   bx(engine,x,y,1.30,.12,.15,.38,aged);
 }
 for(let k=0;k<10;k++){let yy=3+k*.65;bolt(engine,side*6.79,yy,1.55,.06);}
}
// Stack of decorative gears above dial and a glowing turbine at center
const crown=new THREE.Group();crown.position.set(0,11.96,1.4);engine.add(crown);
gear(crown,0,0,0,1.22,20,copper);
gear(crown,1.15,.6,.36,.67,14,gold);
ring(crown,0,0,.6,.45,.16,ember);
// heavy cast iron frame surrounding the housing
for(let side of [-1,1]){
 link(engine,[side*4.9,2.2,1.8],[side*4.9,11.1,1.8],.32,steel);
 cy(engine,side*4.9,11.8,1.8,.47,1.5,brass);
}
link(engine,[-5.3,12.4,1.7],[5.3,12.4,1.7],.29,darkbronze);
for(let i=0;i<26;i++){let x=-5.1+i*.4;bolt(engine,x,12.4,1.99,.05);}
// arches and hanging electric-gas lamps for reflected pools
function lamp(x,y,z){
 const pole=cy(scene,x,y,z,.18,1.8,aged);
 ring(scene,x,y+1,z,.5,.072,brass);
 const light=sph(scene,x,y+1,z,.25,ember);light.castShadow=false;
 return light;
}
lamp(-9.4,6.5,3);lamp(9.4,6.5,3);
const hemi=new THREE.HemisphereLight('#7d91aa','#34261e',.54);scene.add(hemi);
const key=new THREE.DirectionalLight('#ffc58e',2.2);key.position.set(-6,17,11);
key.castShadow=true;key.shadow.mapSize.set(1536,1536);
key.shadow.camera.left=-19;key.shadow.camera.right=19;key.shadow.camera.top=21;key.shadow.camera.bottom=-21;
key.shadow.camera.near=.1;key.shadow.camera.far=65;key.shadow.bias=-.00015;
scene.add(key);
const rim=new THREE.DirectionalLight('#5d99bb',1.3);rim.position.set(7,12,-3);scene.add(rim);
const warmA=new THREE.PointLight('#ff9541',13,15,1.8);warmA.position.set(-7,8,8);scene.add(warmA);
const warmB=new THREE.PointLight('#ffc278',8,14,1.8);warmB.position.set(6,11,9);scene.add(warmB);
const blue=new THREE.PointLight('#91d9ff',4.2,9,2);blue.position.set(0,11,5);scene.add(blue);
// volumetric steam plumes from pressure relief valves, as soft 3d translucent low-poly puffs
const smoke=[];
for(let i=0;i<70;i++){
 const side=i%2?-1:1;
 const m=new THREE.Mesh(new THREE.SphereGeometry(1,8,6),
 new THREE.MeshBasicMaterial({color:'#cbd1ce',transparent:true,opacity:.0,depthWrite:false}));
 m.castShadow=false;
 scene.add(m);smoke.push({m,side,off:seeded(i*7+4),drift:seeded(i*19+4)});
}
const dust=[];
for(let i=0;i<55;i++){
 const x=(seeded(i*17)-.5)*24,y=1+seeded(i*33)*13,z=(seeded(i*59)-.5)*16;
 const m=sph(scene,x,y,z,.035,ember);m.castShadow=false;dust.push({m,x,y,z,s:seeded(i*5)});
}
// Original Lemo post-processing, enabling GTAO and physically based DOF instead of disabling both.
const fx=makePost(renderer,scene,camera,W,H,{ssaa:1,ao:true,aoRadius:.34,aoScale:2.1,aoAmt:.52});
fx.dof.maxCoc=6;fx.dof.aper=85;fx.bloom.strength=.19;fx.bloom.radius=.65;fx.bloom.threshold=1.2;
fx.vig.uniforms.amt.value=.37;fx.vig.uniforms.warm.value=.3;fx.vig.uniforms.contrast.value=.20;fx.vig.uniforms.sat.value=1.0;
window.DUR=8;
window.EV=[{t:1.1,type:'mechanism_start'},{t:3,type:'pressure_release'},{t:5.9,type:'brass_chime'}];
window.render=(t)=>{
 const u=t/8,q=u*u*(3-2*u);
 // close hero three-quarter dolly keeping central dial fully framed. The previous city shot was too distant.
 camera.position.set(-9.5+2.7*q,9.35+1.8*q,23-4.1*q);
 const target=V(0,7.1,-.35);camera.lookAt(target);
 fx.dof.focus=camera.position.distanceTo(target);fx.dof.aper=85;fx.dof.maxCoc=5.5;
 hours.rotation.z=-t*.065;minutes.rotation.z=-t*.44;
 rotors.forEach((g,i)=>g.rotation.z=(i%2?-.7:.53)*t+(i*.4));
 pistons.forEach((p,i)=>p.o.position.y=3+.49*Math.sin(t*3.8+p.phase));
 boilerGroups.forEach((b,i)=>{b.userData.hand.rotation.z=Math.sin(t*.68+i)*.9-.15;b.userData.valve.rotation.z=t*(i===0?-.35:.33)});
 warmA.intensity=13+1.2*Math.sin(t*3.4);warmB.intensity=8+1.0*Math.sin(t*2.8);
 key.intensity=2.2+.10*Math.sin(t*.8);
 for(const s of smoke){
  const v=(s.off+t*.19)%1;
  const x=s.side*5.4+Math.sin(v*9+s.drift*6)*.5;
  const y=10.7+v*4.7;
  s.m.position.set(x,y,-3.1+.5*Math.sin(t*.5+s.off*20));
  s.m.scale.setScalar(.22+v*1.35);
  s.m.material.opacity=.09*(1-v)*Math.min(1,t/1.5);
 }
 dust.forEach((p,i)=>{p.m.position.y=p.y+.3*Math.sin(t*.6+i);p.m.material.emissiveIntensity=.4+Math.sin(t+i)*.2;});
 fx.vig.uniforms.fade.value=Math.min(1,t/.65,(8-t)/.65);
 fx.composer.render();
};
window.READY=true;window.render(0);
</script></body></html>
