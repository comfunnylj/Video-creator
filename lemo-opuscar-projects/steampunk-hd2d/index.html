<script type="module">

}
for(let a=0;a<4;a++){let x=-6.7+a*4.1,z=3.6;

}

const handShort=cube(towerX+.14,5.55,towerZ+1.35,.3,.07,.07,iron);handShort.castShadow=false;
const gearGroup=[];

gear(1.35,2.0,towerZ+1.66,1.1);gear(4.9,2.5,towerZ+1.66,.83);gear(-3.3,1.35,4.15,1.1);
